name: simulacrum

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: simulacrum
      POSTGRES_PASSWORD: simulacrum
      POSTGRES_DB: simulacrum
    ports:
      - '5433:5432'
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U simulacrum -d simulacrum']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres:
