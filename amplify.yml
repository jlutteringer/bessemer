version: 1
applications:
  - appRoot: simulacrum/apps/simulacrum
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install "$(cat ../../../.nvmrc)"
            - nvm use "$(cat ../../../.nvmrc)"
            - corepack enable
            - (cd ../../.. && yarn config set nodeLinker node-modules && yarn config set enableScripts true)
            - (cd ../../.. && COREPACK_ENABLE_DOWNLOAD_PROMPT=0 yarn install --immutable)
        build:
          commands:
            # Amplify only exposes app environment variables to the build, so write the ones SSR needs for runtime
            - env | grep -e '^AMPLIFY_APP_ORIGIN=' -e '^COGNITO_' -e '^NEXT_PUBLIC_SIMULACRUM_API_URL=' >> .env.production || true
            - (cd ../../.. && yarn turbo run build --filter=simulacrum)
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
